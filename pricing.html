<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pricing - ForkStack POS & ERP</title>

<script>
// Smart Location Router: sends the visitor to the pricing page for their country.
// Priority: 
// 1. Explicit URL parameter ?region=in/ae/sa/us
// 2. Fast live IP geolocation (api.country.is -> ipapi.co)
// 3. Timezone heuristic (Kolkata -> IN, Dubai -> AE, Riyadh -> SA, All others -> US)
// 4. Default fallback: US / Global USD (never defaults to IN for international users)
(function () {
  var PAGES = {
    in: 'pricing-india.html',
    ae: 'pricing-uae.html',
    sa: 'pricing-saudi.html',
    us: 'pricing-usa.html'
  };
  var ALIAS = { in: 'in', india: 'in', ae: 'ae', uae: 'ae', sa: 'sa', saudi: 'sa', us: 'us', usa: 'us' };

  var redirected = false;
  function goTo(code) {
    if (redirected) return;
    var page = PAGES[code] || PAGES['us'];
    redirected = true;
    try { localStorage.setItem('forkstack_user_region', code); } catch (e) {}
    window.location.replace(page);
  }

  // 1. Explicit choice via ?region= (e.g. pricing.html?region=us or pricing.html?region=ae)
  try {
    var regParam = (new URLSearchParams(window.location.search).get('region') || '').toLowerCase();
    if (ALIAS[regParam]) { goTo(ALIAS[regParam]); return; }
  } catch (e) {}

  // Function to guess region from browser timezone
  function tzGuess() {
    try {
      var tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || '').toLowerCase();
      if (tz.indexOf('kolkata') > -1 || tz.indexOf('calcutta') > -1 || tz.indexOf('india') > -1) return 'in';
      if (tz.indexOf('dubai') > -1 || tz.indexOf('muscat') > -1 || tz.indexOf('uae') > -1) return 'ae';
      if (tz.indexOf('riyadh') > -1 || tz.indexOf('jeddah') > -1 || tz.indexOf('saudi') > -1) return 'sa';
      // Any other timezone (America/Toronto, America/Vancouver, Europe/London, Asia/Singapore, etc.) -> US/Global
      return 'us';
    } catch (e) {}
    return 'us';
  }

  function countryToRegion(c) {
    if (!c) return null;
    c = c.toUpperCase();
    if (c === 'IN') return 'in';
    if (c === 'AE') return 'ae';
    if (c === 'SA') return 'sa';
    // All other countries (CA, US, GB, AU, DE, FR, JP, etc.) map to US & Global pricing
    return 'us';
  }

  // Safety fallback after 1.8 seconds max
  var safetyTimer = setTimeout(function() {
    goTo(tzGuess());
  }, 1800);

  // Try fast CORS-friendly IP geolocation endpoint first
  fetch('https://api.country.is/', { signal: AbortSignal.timeout(1500) })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      clearTimeout(safetyTimer);
      var reg = countryToRegion(data && data.country);
      goTo(reg || tzGuess());
    })
    .catch(function () {
      // Secondary IP geolocation fallback (ipapi.co)
      fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(1500) })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          clearTimeout(safetyTimer);
          var reg = countryToRegion(data && data.country_code);
          goTo(reg || tzGuess());
        })
        .catch(function () {
          clearTimeout(safetyTimer);
          goTo(tzGuess());
        });
    });
})();
</script>

            },
            "fontFamily": {

                "body": ["Inter", "sans-serif"]
            }
        }
    }
}
</script>

  </div>

  <div class="pt-4 border-t border-border-subtle space-y-2 text-xs font-medium">

      <a href="pricing-uae.html" class="p-3 bg-surface-container hover:bg-emerald-50 hover:text-primary rounded-xl font-bold transition-all flex items-center justify-center gap-1.5">🇦🇪 UAE (AED)</a>
      <a href="pricing-saudi.html" class="p-3 bg-surface-container hover:bg-emerald-50 hover:text-primary rounded-xl font-bold transition-all flex items-center justify-center gap-1.5">🇸🇦 Saudi Arabia (SAR)</a>
      <a href="pricing-usa.html" class="p-3 bg-surface-container hover:bg-emerald-50 hover:text-primary rounded-xl font-bold transition-all flex items-center justify-center gap-1.5">🇺🇸 USA & Global ($)</a>
    </div>
  </div>
