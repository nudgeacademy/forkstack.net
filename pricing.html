<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pricing - ForkStack POS & ERP</title>

<script>
// Smart Location Router: Redirects user to their country pricing page
(function() {
  function getTargetPage() {
    // Check URL search param first (e.g. pricing.html?region=ae)
    const params = new URLSearchParams(window.location.search);
    const regParam = (params.get('region') || '').toLowerCase();
    if (regParam === 'in' || regParam === 'india') return 'pricing-india.html';
    if (regParam === 'ae' || regParam === 'uae') return 'pricing-uae.html';
    if (regParam === 'sa' || regParam === 'saudi') return 'pricing-saudi.html';
    if (regParam === 'us' || regParam === 'usa') return 'pricing-usa.html';

    // Check localStorage
    const saved = localStorage.getItem('forkstack_user_region');
    if (saved === 'in') return 'pricing-india.html';
    if (saved === 'ae') return 'pricing-uae.html';
    if (saved === 'sa') return 'pricing-saudi.html';
    if (saved === 'us') return 'pricing-usa.html';

    // Check Timezone heuristic
    try {
      const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || "").toLowerCase();
      if (tz.includes("kolkata") || tz.includes("calcutta") || tz.includes("india")) return 'pricing-india.html';
      if (tz.includes("dubai") || tz.includes("muscat") || tz.includes("uae") || tz.includes("emirates")) return 'pricing-uae.html';
      if (tz.includes("riyadh") || tz.includes("saudi") || tz.includes("jeddah")) return 'pricing-saudi.html';
      if (tz.includes("america") || tz.includes("us/") || tz.includes("york") || tz.includes("chicago") || tz.includes("los_angeles") || tz.includes("london") || tz.includes("europe")) return 'pricing-usa.html';
    } catch (e) {}

    return 'pricing-india.html'; // Default to India or fallback
  }

  const target = getTargetPage();
  window.location.replace(target);

  // Fast async IP check as secondary precision check
  fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(2000) })
    .then(res => res.json())
    .then(data => {
      const country = (data.country_code || '').toUpperCase();
      let ipTarget = null;
      if (country === 'IN') ipTarget = 'pricing-india.html';
      else if (country === 'AE') ipTarget = 'pricing-uae.html';
      else if (country === 'SA') ipTarget = 'pricing-saudi.html';
      else if (country) ipTarget = 'pricing-usa.html';

      if (ipTarget && window.location.pathname.endsWith('pricing.html')) {
        window.location.replace(ipTarget);
      }
    })
    .catch(function() {});
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

tailwind.config = {

                "on-primary": "#ffffff",
                "surface": "#f8f9fa",
                "surface-container": "#edeeef",
                "on-surface": "#191c1d",
                "on-surface-variant": "#3e4a3d",
                "border-subtle": "#E5E7EB"
            },
            "fontFamily": {
                "headline": ["Sora", "sans-serif"],
                "body": ["Inter", "sans-serif"]
            }
        }
    }
}
</script>

<div class="max-w-md bg-white border border-border-subtle rounded-2xl p-8 shadow-lg space-y-6">
  <img src="assets/logo.png" alt="ForkStack logo" class="w-12 h-12 mx-auto rounded-full object-cover">
  <div class="space-y-2">
    <h1 class="font-headline text-2xl font-bold">Redirecting to Pricing...</h1>
    <p class="font-body text-xs text-on-surface-variant">We are detecting your location to show local pricing and currency.</p>
  </div>

  <div class="pt-4 border-t border-border-subtle space-y-2 text-xs font-medium">
    <p class="text-gray-400 font-bold uppercase tracking-wider">Or select your country:</p>
    <div class="grid grid-cols-2 gap-2">
      <a href="pricing-india.html" class="p-3 bg-surface-container hover:bg-emerald-50 hover:text-primary rounded-xl font-bold transition-all flex items-center justify-center gap-1.5">🇮🇳 India (₹)</a>
      <a href="pricing-uae.html" class="p-3 bg-surface-container hover:bg-emerald-50 hover:text-primary rounded-xl font-bold transition-all flex items-center justify-center gap-1.5">🇦🇪 UAE (AED)</a>
      <a href="pricing-saudi.html" class="p-3 bg-surface-container hover:bg-emerald-50 hover:text-primary rounded-xl font-bold transition-all flex items-center justify-center gap-1.5">🇸🇦 Saudi Arabia (SAR)</a>
      <a href="pricing-usa.html" class="p-3 bg-surface-container hover:bg-emerald-50 hover:text-primary rounded-xl font-bold transition-all flex items-center justify-center gap-1.5">🇺🇸 USA & Global ($)</a>
    </div>
  </div>
</div>
